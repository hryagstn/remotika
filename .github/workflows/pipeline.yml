name: Remotika Data Pipeline

on:
  schedule:
    - cron: '0 0 1 * *' # Run monthly on the 1st
  workflow_dispatch: # Allow manual trigger from the GitHub Actions tab

permissions:
  contents: write # Required for git-auto-commit-action to push changes back to git

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run pipeline script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: npm run pipeline

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): auto-update verified companies database [skip ci]"
          file_pattern: "src/data/companies.json"
          commit_user_name: "GitHub Actions Bot"
          commit_user_email: "actions@github.com"
