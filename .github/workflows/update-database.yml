name: Scheduled Database Update

on:
  schedule:
    - cron: '0 0 * * *' # Berjalan setiap hari pukul 00:00 UTC (07:00 WIB)
  workflow_dispatch: # Memungkinkan dijalankan secara manual dari tab Actions di GitHub

jobs:
  update-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run pipeline

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/companies.json
          # Melakukan commit hanya jika ada perubahan pada database companies.json
          git diff-index --quiet HEAD || (git commit -m "chore: auto-update verified companies data" && git push)
